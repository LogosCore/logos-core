# A command an operator gave a session's minion (docs:
# contracts/minion-messages.md). It waits until the minion asks for tasks
# at a check-in, is sent again until the minion acks it, streams its output
# as it runs, and ends done, failed or cancelled. The team's: every member
# of the session's operation sees a session's tasks, and who gave each.
type MinionTask {
  # The id it travels under.
  id: ID!
  # Feedback its minion sent about it (MinionFeedback), newest first, the
  # latest 20.
  feedback: [MinionFeedback!]!
  # How many errors and warnings its minion sent about it, all of them.
  feedbackErrors: Int!
  feedbackWarnings: Int!
  # Counts the task's changes: of two copies, the one with the higher rev
  # is the newer (a mutation's answer can come after live updates).
  rev: Int!
  sessionId: ID!
  operationId: ID!
  # One of the session's build's commands (minionSessionCommands).
  command: String!
  # Its params' values as the operator gave them; the task carries them
  # with the params' defaults filled in.
  args: JSON
  # Who it ran as when not its process's own: what its minion said, else the
  # session's acting identity when it was acked. how null: the process's own
  # whatever the session's (an SSH file command while the session became).
  as: MinionIdentity
  issuedBy: ID!
  # The operator's username; null when the user is gone.
  issuedByName: String
  # QUEUED (waiting for the minion to ask), SENT (not acked yet), RUNNING
  # (the minion has it: acked, or its output coming),
  # DONE (the minion did it), FAILED or CANCELLED.
  state: String!
  queuedAt: String!
  # When it first went out, and how many times it did.
  sentAt: String
  sendCount: Int!
  # When the minion acked it, or its first output came.
  ackedAt: String
  startedAt: String
  doneAt: String
  # Why core asked to stop it, when core did (a tunnel no stream used for
  # its stop_idle, its port not opening again after a restart); null when an
  # operator did, or nobody.
  cancelReason: String
  # When an operator asked to stop it; a cancel goes with every reply to the
  # minion until it ends.
  cancelRequestedAt: String
  # What the minion said at the end: whether it did what the task asked,
  # the exit code of a process it ran, and what went wrong.
  ok: Boolean
  exit: Int
  err: String
  # The output: the parts joined in order, read as UTF-8 (bytes that are not
  # stand as U+FFFD; outputUtf8 says whether all were). At most 4 MiB is
  # kept (outputTruncated). Read only when asked for: a list asks for the
  # rest. The bytes as they came: GET /api/v1/minion-tasks/{id}/output.
  output: String!
  outputSize: Int!
  outputUtf8: Boolean!
  outputTruncated: Boolean!
  # How many result parts came: it grows with each, output, data or
  # listings alone (a walk sends thousands).
  parts: Int!
  # How many parts came with data: with outputSize and state, what tells a
  # client showing a task's output and data to read them again.
  dataParts: Int!
  # What its data is (dir_listing), as its command said when it was queued;
  # null: no declared shape.
  result: String
  # What core does with it beyond carrying it (tunnel: core's SOCKS proxy
  # in front), as its command said when it was queued; null for none
  # (docs: contracts/task-results-and-actions.md).
  action: String
  # A tunnel task's proxy: its port and its streams' numbers; null for any
  # other task.
  tunnel: MinionTunnel
  # The command's structured output: the parts' data, kept as the CBOR it
  # came in, joined by its result's rule (or, with none, arrays appended)
  # and given as JSON by the contract's mapping (docs:
  # contracts/task-results-and-actions.md). The bytes as they came:
  # GET /api/v1/minion-tasks/{id}/data, a CBOR sequence.
  data: JSON
  # The data bytes kept, and whether more came and was dropped: output and
  # data share the task's 4 MiB.
  dataSize: Int!
  dataTruncated: Boolean!
  # The first part whose data does not fit the result, and why: the data
  # is then shown raw.
  dataProblem: String
  # Parts before the done part that never came: lost for good.
  missingParts: Int!
  # The file a file_download task's minion sends core, as far as it came;
  # null for other tasks, or before its first chunk.
  file: MinionFile
  # The file core sends the minion for the task's file param (an upload),
  # and how far the minion has it; null for a task without one.
  upload: MinionTaskUpload
  # The file a stream_file task's minion streams to whoever downloads it,
  # from its announcement; null before, and for other tasks.
  stream: MinionTaskStream
  # The task as core keeps it (its minion_tasks document, its result parts
  # left out), as indented JSON in the stored key order: for debugging.
  # Ids read as UUIDs, times as RFC 3339, wire_args decoded from CBOR
  # ({"$cbor": ...}), other bytes as {"$binary": base64}.
  document: String!
}

# A file a minion sends core for a download_file task (docs:
# contracts/minion-messages.md, File transfers). Kept in core's minion
# files bucket; the bytes: GET /api/v1/minion-files/{id}.
type MinionFile {
  id: ID!
  # The file's name as the minion has it: a path on its host.
  name: String!
  # Its size, as the minion said it, and how much of it came.
  size: Int!
  received: Int!
  # The whole's SHA-256 in hex, as the minion said it: checked when the
  # last chunk came. Null until then.
  sha256: String
  # RECEIVING (chunks coming), JOINING (all came; joined and checked),
  # COMPLETE (kept), FAILED (did not check out, or given up after a day
  # without a chunk) or CANCELLED (its task stopped or failed on the way).
  state: String!
  # Why it failed or was cancelled.
  err: String
  # What its first bytes say it is (a MIME type), once kept; null before.
  contentType: String
  createdAt: String!
  doneAt: String
}

# A task's file going to its minion (docs: contracts/minion-messages.md,
# Core sending a file). The file is as it was when the task was queued:
# core drops the task file once its tasks end, these stay.
type MinionTaskUpload {
  fileId: ID!
  name: String!
  size: Int!
  # The file's SHA-256 in hex.
  sha256: String!
  # How far the minion has it: its last ack.
  acked: Int!
  # WAITING (the minion has not asked for it yet), SENDING, SENT (all of it
  # there: the minion checks it), DONE (it wrote it, its size and SHA-256
  # the file's), FAILED or CANCELLED.
  state: String!
  # The minion's first ask for a chunk, and its last.
  firstAckAt: String
  lastAckAt: String
  # A stream (upload_stream): the file comes as its uploader sends it
  # (PUT /api/v1/minion-streams/{task}); fileId is empty. sized: its size
  # is known (it is, for a task file); received: how much core took from
  # the uploader. uploaderState: WAITING (for an uploader), UPLOADING,
  # PAUSED (its uploader went away), DONE (core has it all), STOPPED; null
  # for a task file. from, attachedAt and uploaderAt: where and when the
  # uploader now took the stream, and when it last sent.
  stream: Boolean!
  sized: Boolean!
  received: Int!
  uploaderState: String
  from: Int!
  attachedAt: String
  uploaderAt: String
}

# A file a minion streams (docs: contracts/minion-messages.md, Streaming
# a file): GET /api/v1/minion-streams/{task} downloads it, as it comes.
type MinionTaskStream {
  # The file's path on the host, and the size the minion announced.
  name: String!
  size: Int!
  # How far the minion has sent it (what core wants next), and how far
  # the downloader has it.
  sent: Int!
  delivered: Int!
  # WAITING (for a downloader), STREAMING, PAUSED (its downloader went
  # away), DONE, FAILED or CANCELLED.
  state: String!
  # The whole's SHA-256 in hex, when the minion read it in order once.
  sha256: String
  announcedAt: String!
  # Where and when the downloader now took the stream, and when it last
  # said it is there: its rate is delivered - from over readerAt -
  # attachedAt. Null before a downloader.
  from: Int!
  attachedAt: String
  readerAt: String
}

# A tunnel task's proxy (docs: contracts/minion-messages/tunnels.md):
# core's SOCKS on one of its operational ports while the task runs, each
# connection a tool makes through it a stream the minion connects from its
# host. A reverse port forward's goes the other way: the minion listens on
# its host, and core connects each connection that comes there to to.
type MinionTunnel {
  # The operational port, and the host operators reach it at (core's
  # OPERATIONAL_ADDRESS); null: the host the web app is reached at. 0 for
  # a reverse port forward, which has none.
  port: Int!
  address: String
  # What core puts in front, the task's front: socks (core's SOCKS proxy
  # on the port), http (its HTTP proxy), forward (every connection a
  # stream to to, host:port) or terminal (a process for each connection).
  # A reverse tunnel's (reverse: the minion listens): forward (core
  # connects each of its streams to to).
  front: String!
  reverse: Boolean!
  to: String
  # A forward's to a unix socket's path or a named pipe (\\.\pipe\name,
  # \\host\pipe\name) instead of to; null for any other.
  path: String
  # The address of the minion's host a tunnel's TCP streams go from; null:
  # as the host routes. tls: a forward's speak TLS to its destination.
  source: String
  tls: Boolean!
  # A terminal's (front terminal): the program each connection runs on the
  # minion's host (null: its shell), its args as a command line, and the
  # terminal's size on the raw port (a web terminal says its own). Null for
  # any other front.
  program: String
  args: String
  rows: Int
  cols: Int
  # A SOCKS proxy's: it takes BIND (its command opens accept), while it
  # runs.
  socksBind: Boolean!
  # Its bandwidth cap, bytes a second each way, over all of its streams;
  # 0 for none. setMinionTunnelCap changes it while it runs.
  cap: Int!
  # A reverse port forward's: where the minion is to listen, as the task
  # asked (listen 0: any free port), and where it says it does (null until
  # it says). Null for any other tunnel.
  bind: String
  listen: Int
  bound: String
  # A reverse port forward's: it listens for UDP datagrams, a stream for
  # each address they come from. Null for any other tunnel.
  udp: Boolean
  # Core listens on it: the task runs. A reverse port forward's: the
  # minion said it listens, and the task runs.
  listening: Boolean!
  # When core stops the task unless a stream opens first (its stop_idle):
  # null while a stream is open, before the minion has the task, or with
  # none.
  stopsAt: String
  # Its streams now (opening or open), and how many it has had.
  open: Int!
  streams: Int!
  # How many streams it carries at once (its max_streams): one past it is
  # refused (a reverse tunnel's, reset). timeoutMs: how long a connect may
  # take (its timeout), milliseconds: the minion's to a destination, or a
  # reverse tunnel's core's. Each its args', else core's default.
  maxStreams: Int!
  timeoutMs: Int!
  # How many of its ended streams core keeps to list while its task runs,
  # the latest (the open ones it always has). Once the task ended it keeps
  # none: what is left is these numbers.
  kept: Int!
  # The bytes its tools sent through it (up), and got back (down).
  up: Int!
  down: Int!
  # A VPN's (front vpn, docs: contracts/vpn-front): the networks its
  # clients route, CIDRs (setMinionTunnelRoutes changes them while it
  # runs), and its clients, logos-vpn on operators' machines, while it
  # runs. Null and empty for any other tunnel.
  routes: [String!]
  vpnClients: [MinionVPNClient!]!
}

# A client of a VPN tunnel: logos-vpn on one operator's machine, connected
# with a key of theirs, or kept a while since its link dropped.
type MinionVPNClient {
  # Its instance: what disconnectMinionVPNClient names.
  id: ID!
  # What its streams say they came from: vpn: user@machine.
  name: String!
  user: String!
  # Its machine's name, its system (GOOS, GOARCH) and its release.
  machine: String!
  os: String!
  arch: String!
  version: String!
  # The address it connected from, as core saw it, and since when.
  from: String!
  since: String!
  # Its link is up; else core keeps it a while for another.
  connected: Boolean!
  # Its streams now, how many it opened, and its bytes each way.
  open: Int!
  streams: Int!
  up: Int!
  down: Int!
}

# A key for one client of a VPN tunnel: one operator's, for one task. It
# lapses unused at lapsesAt; a client that took it has it until it
# disconnects.
type MinionVPNKey {
  key: String!
  lapsesAt: String!
}

# One stream of a tunnel task: a connection a tool made through its proxy,
# who reached what through the minion. Core keeps them only while the task
# runs, the open ones and the latest ended ones (MinionTunnel.kept); the
# bytes never.
type MinionTunnelStream {
  # Its number in the task, from 1.
  stream: Int!
  # The tool's address (the SOCKS client's), and the destination as the
  # tool named it; a UDP association (udp) has none, its datagrams each
  # name their own.
  client: String!
  host: String!
  port: Int!
  # A forward's to a unix socket or a pipe: its path, instead of host and
  # port.
  path: String
  udp: Boolean!
  # What it opens past a TCP connection or a UDP association: unix, pipe,
  # process (a terminal's), accept (a SOCKS BIND) or icmp (a VPN client's
  # pings); null for those.
  kind: String
  # A process's: its program (null: the host's shell), whether it runs in
  # a terminal (false: on pipes; null until it started), and its exit code
  # once the minion said it.
  program: String
  terminal: Boolean
  exit: Int
  # An accept's: who connected, host:port.
  came: String
  openedAt: String!
  # OPENING (the minion connects), OPEN or ENDED.
  state: String!
  # The minion's reply: open, refused, host_unreachable, net_unreachable,
  # timed_out, not_allowed, failed, unsupported, not_found, denied or
  # in_use; its socket's address when open (an accept's: where it
  # listens), and why not. Null before it came.
  result: String
  bound: String
  msg: String
  # When and how it ended: done, not_opened, no_reply, client_reset, reset
  # (by the destination or the minion), lost (the minion no longer had it),
  # task_ended or core_stopped.
  endedAt: String
  end: String
  # The bytes the tool sent (up), and got back (down), so far.
  up: Int!
  down: Int!
}

# A page of a tunnel task's streams, the latest first.
type MinionTunnelStreamPage {
  streams: [MinionTunnelStream!]!
  # Where the next (older) page starts; null on the last.
  before: String
}

# A link to download a stream without a session (curl), valid while the
# stream lasts and until expiresAt at most.
type MinionStreamLink {
  # A path under /api/v1, with its signature.
  path: String!
  expiresAt: String!
}

# A printable string in a kept file, as strings(1) finds it: length bytes
# from offset, in encoding: ascii (a byte a character) or utf16le (each
# character followed by a zero byte).
type MinionFileString {
  offset: Int!
  length: Int!
  encoding: String!
  text: String!
}

# A page of a file's strings, in the order they are in it.
type MinionFileStringPage {
  strings: [MinionFileString!]!
  # Where in the file the next page reads from (its after); the file's size
  # when done.
  next: Int!
  # The file was read to its end.
  done: Boolean!
}

# A page of a session's tasks, newest first.
type MinionTaskPage {
  tasks: [MinionTask!]!
  # Where the next (older) page starts; null on the last.
  before: String
}

extend type Query {
  # One task, with its output. Needs at least viewer.
  minionTask(id: ID!): MinionTask
    @hasPermission(permission: "operation:member")

  # A session's tasks, newest first, at most last (50 by default, 200 at
  # most), before a page's cursor. Needs at least viewer.
  minionTasks(sessionId: ID!, last: Int, before: String): MinionTaskPage!
    @hasPermission(permission: "operation:member")

  # A tunnel task's streams, the latest first, at most last (50 by default,
  # 200 at most), before a page's cursor: search matches the tool's address
  # and the destination, state (OPEN or ENDED) narrows them. Those core
  # keeps: none once the task ended (MinionTunnel.kept). Needs at least
  # viewer.
  minionTunnelStreams(taskId: ID!, last: Int, before: String, search: String, state: String): MinionTunnelStreamPage!
    @hasPermission(permission: "operation:member")

  # The commands a session's minion takes: its build's, with what a task of
  # each takes. Needs at least viewer.
  minionSessionCommands(sessionId: ID!): [BuildCommand!]!
    @hasPermission(permission: "operation:member")

  # A page of the printable strings in a kept file, read from after (0, or
  # a page's next): at most first (200 by default, 1000 at most), of at
  # least minLength characters (4 by default, 2 to 256), in encoding (ascii
  # or utf16le; both by default), holding search in any case. A page reads
  # at most 8 MiB of the file: with a search, it can come back short, or
  # empty, and not done. Needs at least viewer.
  minionFileStrings(fileId: ID!, after: Int, first: Int, minLength: Int, encoding: String, search: String): MinionFileStringPage!
    @hasPermission(permission: "operation:member")
}

extend type Mutation {
  # Gives a session's minion a command: args are checked against the
  # command's params and the task waits for the minion's next check-in.
  # Needs operator; agent API keys are rejected.
  queueMinionTask(sessionId: ID!, command: String!, args: JSON): MinionTask!
    @hasPermission(permission: "operation:member")

  # Stops a task: one not sent yet is cancelled at once, one sent is asked
  # to stop (it still sends its end). Nothing for one that ended. Needs
  # operator.
  cancelMinionTask(id: ID!): MinionTask!
    @hasPermission(permission: "operation:member")

  # Changes a running tunnel task's bandwidth cap: bytes a second each way,
  # over all of its streams, 0 for none. Needs operator.
  setMinionTunnelCap(taskId: ID!, cap: Int!): MinionTask!
    @hasPermission(permission: "operation:member")

  # Changes a running VPN tunnel's routes, CIDRs (1 to 64; no default
  # route): its clients take them at once. Needs operator.
  setMinionTunnelRoutes(taskId: ID!, routes: [String!]!): MinionTask!
    @hasPermission(permission: "operation:member")

  # A key for a client of a running VPN tunnel, for the caller: logos-vpn
  # connects with it (sudo logos-vpn <core> <key>). Needs operator.
  createMinionVPNKey(taskId: ID!): MinionVPNKey!
    @hasPermission(permission: "operation:member")

  # Ends a client of a VPN tunnel (its id), saying who did. Needs
  # operator.
  disconnectMinionVPNClient(taskId: ID!, client: ID!): MinionTask!
    @hasPermission(permission: "operation:member")

  # A signed link to download a stream_file task's stream (for curl).
  # Needs at least viewer.
  minionStreamLink(taskId: ID!): MinionStreamLink!
    @hasPermission(permission: "operation:member")
}

extend type Subscription {
  # A session's tasks as they change: queued, sent, output, ended. Needs at
  # least viewer.
  minionTaskChanged(sessionId: ID!): MinionTask!
    @hasPermission(permission: "operation:member")
}
