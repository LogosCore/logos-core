# =============================================================================
# Modules — module-instance registry (app-admin management)
# =============================================================================
#
# A Module is one row in the durable registry: a channel or factory
# instance that registered over the AMQP control plane. This surface is the
# app-admin Modules page — list every instance with its lifecycle state, and
# remove (deregister) one.
#
# "Remove" is a SOFT deregister: it flips status to "deregistered" and busts the
# data-plane registration gate. It is NOT durable eviction — a module that is
# still alive re-registers on its next reconnect and reappears as "registered".
# The all-states list makes that flip visible. Hard eviction (blocking
# re-registration) is a follow-up.
#
# Status is a plain String, not an enum, to bind directly to the stored value
# without marshalling gymnastics. Known values: "registered", "deregistered",
# "dead".

type Module {
  # Self-assigned, globally-unique instance id (e.g. "http-channel-1"). The
  # identity used by heartbeat/deregister and the data-plane registration gate.
  # Unique per deployed instance — an operator may run several instances of the
  # same module, each with its own id.
  instance: ID!
  # Module kind: "channel" | "factory".
  type: String!
  # The module's hardcoded identity — its project/kind name (e.g. "http",
  # "telegram"), baked into the implementation and shared by every instance of
  # that module. Distinct from `instance`, which is per-deployment.
  name: String!
  version: String!
  # Free-text, self-reported description the module supplies at registration.
  # Empty if the module declared none.
  description: String!
  # The module's own SVG icon from its registration (checked: shapes only, no
  # scripts or outside references). Empty when it sent none; the UI then shows
  # its type's default. Drawn as a single-colour glyph in the text colour.
  icon: String!
  # Lifecycle state: "registered" | "deregistered" | "dead" | "blocked".
  status: String!
  # Self-reported health on the most recent heartbeat:
  # "healthy" | "degraded". Empty until the first heartbeat.
  lastStatus: String!
  registeredAt: String!
  # RFC3339 of the most recent heartbeat, or null if it has never beaten.
  lastHeartbeatAt: String
  # Populated once the instance is deregistered; null while registered/dead.
  deregisteredAt: String
  deregisterReason: String!
  # Populated once the reaper declares the instance dead; null otherwise.
  declaredDeadAt: String
  # While blocked: when, by whom and why (reason empty when none was given).
  blockedAt: String
  blockedBy: ModuleActor
  blockReason: String!
}

# Streamed on the moduleChanged subscription. REGISTERED maps to CREATED;
# DEREGISTERED and DEAD map to UPDATED (the row survives, only its status
# changes). `module` carries the full post-transition row.
type ModuleEvent {
  action: EventAction!
  # What happened, more precisely than action: lets clients patch caches
  # instead of refetching (a heartbeat changes no history).
  kind: ModuleEventKind!
  instance: ID!
  module: Module
}

enum ModuleEventKind {
  REGISTERED
  DEREGISTERED
  DEAD
  # An operator blocked the instance, lifted the block, or deleted its row.
  BLOCKED
  UNBLOCKED
  DELETED
  # Config written, apply result recorded, action finished.
  CHANGED
  # Last heartbeat, health and status values.
  HEARTBEAT
}

# --- Queries ---

extend type Query {
  # Every module instance, newest registration first. Pass `status` to filter
  # to a subset of lifecycle states (e.g. ["registered"]); omit for all states.
  modules(status: [String!]): [Module!]!
    @hasPermission(permission: "module:read")
}

# --- Mutations ---

extend type Mutation {
  # Block an instance, whatever its state: core refuses its registrations,
  # heartbeats and traffic until it is unblocked, so a running one is cut off
  # at once and cannot come back. reason is shown with the block.
  blockModule(instance: ID!, reason: String): Module!
    @hasPermission(permission: "module:delete")
  # Lift a block: the instance is deregistered, free to register again (a
  # running one does on its next attempt).
  unblockModule(instance: ID!): Module!
    @hasPermission(permission: "module:delete")
  # Delete the row of an instance that is gone (deregistered or dead). Its
  # stored configuration and history stay; if it registers again it appears
  # again. A registered instance would only register again: block it instead.
  deleteModule(instance: ID!): Boolean!
    @hasPermission(permission: "module:delete")
}

# --- Subscriptions ---

extend type Subscription {
  # Stream module lifecycle changes (registered / deregistered / dead) for the
  # admin Modules page. Not operation-scoped — admin-only via module:read.
  moduleChanged: ModuleEvent!
    @hasPermission(permission: "module:read")
}
