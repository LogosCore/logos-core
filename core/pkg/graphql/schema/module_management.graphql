# =============================================================================
# Module management — declared properties, actions and status (prototype)
# =============================================================================
#
# A module declares a management manifest at module.register (see
# logos-golang-protocol/protocol/management.go). Config is per instance only:
# core stores the desired value of each property for one instance, and there
# is no shared configuration across instances of the same module.
#
# effective = the instance's stored value ?? the module's own default.
# Every write bumps the instance's config revision, which only ever grows.
# Core pushes the config to the instance (mgmt.config.apply); the instance
# reports the revision it processed (appliedRevision).

# Arbitrary JSON value (property values, defaults, bounds, action params/results).
scalar JSON

extend type Module {
  # Null when the module declared no management manifest.
  management: ModuleManagement
}

enum ModuleSyncState {
  # appliedRevision == revision
  IN_SYNC
  # A newer revision is being pushed / awaiting the module's ack.
  PENDING
  # Pushing failed repeatedly, or the module is not registered.
  OUT_OF_SYNC
}

type ModuleManagement {
  schemaVersion: String!
  properties: [ModuleProperty!]!
  actions: [ModuleAction!]!
  status: [ModuleStatusValue!]!
  # Optional features the module serves, e.g. "logs" (live log tail).
  capabilities: [String!]!

  # The instance's config revision (expectedRevision for updateModuleConfig),
  # and the one the instance last processed.
  revision: Int!
  appliedRevision: Int!
  syncState: ModuleSyncState!
  # Last push/apply error, if any.
  lastApplyError: String
}

type ModuleEnumOption {
  value: String!
  label: String
  # What choosing this option does.
  description: String
}

# A typed field: a property or an action parameter.
# type: string | int | number | bool | enum | duration | bytes | url | secret | string_list | string_map
type ModuleField {
  key: String!
  type: String!
  label: String!
  description: String
  group: String
  order: Int!
  unit: String
  placeholder: String
  # What a string field holds, e.g. "user_agent": a UI hint (helpers such as
  # a generator), never validated.
  format: String
  required: Boolean!
  default: JSON
  min: JSON
  max: JSON
  # For string_list and string_map, pattern and maxLength apply to each item
  # (each value of a map).
  pattern: String
  maxLength: Int
  # string_map: what every key must match.
  keyPattern: String
  # string_list / string_map / enum_list: most items or entries.
  maxItems: Int
  options: [ModuleEnumOption!]
  # file: the extensions (".ico") or media types ("image/*") a file may have;
  # any when empty.
  accept: [String!]
  # file: the largest file in bytes; null when there is no limit.
  maxSize: JSON
}

type ModuleProperty {
  field: ModuleField!
  # "live" | "restart"
  apply: String!
  # Effective desired value: the stored value, else the default. Always null
  # for secrets (see isSet).
  effective: JSON
  # "default" (nothing stored; the module uses its default) | "set".
  source: String!
  # The stored value; null when unset. Always null for secrets.
  value: JSON
  # Whether a value is stored (the only signal for secrets).
  isSet: Boolean!
  # The module rejected the current value at the applied revision.
  rejectedReason: String
  # A restart-mode change the module has not picked up yet.
  restartRequired: Boolean!
}

type ModuleAction {
  name: String!
  label: String!
  description: String
  # "low" | "high". High-risk actions need module:action:invoke:high.
  risk: String!
  confirm: String
  params: [ModuleField!]!
  timeoutSeconds: Int!
}

type ModuleStatusValue {
  key: String!
  type: String!
  label: String!
  description: String
  unit: String
  # Latest reported value from heartbeat metrics; null if never reported.
  value: JSON
  # The value the module declared as needing attention (bool, enum, string),
  # or null. The UI highlights a matching value.
  alert: JSON
}

type ModuleActor {
  type: String!
  id: String!
  name: String
}

enum ModuleActionStatus {
  RUNNING
  SUCCEEDED
  FAILED
  TIMED_OUT
}

type ModuleActionInvocation {
  id: ID!
  instance: ID!
  action: String!
  params: JSON
  status: ModuleActionStatus!
  result: JSON
  error: String
  actor: ModuleActor!
  startedAt: String!
  finishedAt: String
}

type ModuleConfigChange {
  id: ID!
  instance: ID!
  # The instance's config revision this change produced.
  revision: Int!
  # Changed keys with old/new values; secrets redacted as "***".
  changes: [ModuleConfigKeyChange!]!
  actor: ModuleActor!
  at: String!
}

type ModuleConfigKeyChange {
  key: String!
  old: JSON
  new: JSON
}

input ModuleConfigValueInput {
  key: String!
  # null clears the stored value (resets the property to the module's default).
  value: JSON
}

extend type Query {
  module(instance: ID!): Module
    @hasPermission(permission: "module:read")

  # Newest first.
  moduleActionInvocations(instance: ID!, limit: Int): [ModuleActionInvocation!]!
    @hasPermission(permission: "module:read")

  # Config changes of this instance, newest first.
  moduleConfigChanges(instance: ID!, limit: Int): [ModuleConfigChange!]!
    @hasPermission(permission: "module:read")
}

extend type Mutation {
  # Set or clear property values of one instance. expectedRevision is the
  # instance's current config revision (ModuleManagement.revision); a mismatch
  # fails with CONFLICT. Validated against the instance's manifest; agent API
  # keys are rejected.
  updateModuleConfig(
    instance: ID!
    values: [ModuleConfigValueInput!]!
    expectedRevision: Int!
  ): Module! @hasPermission(permission: "module:config:write")

  # Run a declared action on a registered instance and wait for its result
  # (bounded by the action's timeout). High-risk actions additionally need
  # module:action:invoke:high. Agent API keys are rejected.
  invokeModuleAction(instance: ID!, action: String!, params: JSON): ModuleActionInvocation!
    @hasPermission(permission: "module:action:invoke")
}
