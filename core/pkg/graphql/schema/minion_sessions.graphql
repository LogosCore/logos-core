# =============================================================================
# Minion sessions — the running processes of an operation's minions
# =============================================================================
#
# A minion's hello opens a session (docs: contracts/minion-messages.md): one
# per running process of a build, with the host and process the hello
# described. Core opens them from the data plane; nobody edits them here. A
# session nobody checks in to within a day of its hello is removed. Viewers of
# an operation read them.

type MinionSession {
  # The session id the minion sends its messages under.
  id: ID!
  # Counts the session's changes: of two copies, the one with the higher
  # rev is the newer (a mutation's answer can come after live updates).
  # The caller's mark is not the session's: it does not count. 0 for a
  # reserved session.
  rev: Int!
  # OPEN, CLOSED (expired or of a deleted operation), or RESERVED: reserved
  # with a build for its minion's first claim, with no number, keys or host
  # yet (only minionSession(id) returns one).
  state: String!
  # The display id for operators: the operation's count of sessions when it
  # opened, 1 for the first. Never reused.
  number: Int!
  operationId: ID!
  # The build the minion was made by. The build may have been deleted since.
  buildId: ID!
  # The build's description when the session opened.
  buildDescription: String!
  # What the session is for, the operators' note: the build's description
  # when it opened, then theirs to edit (setMinionSessionDescription).
  description: String!
  # The factory kind, target and platform of the build.
  moduleName: String!
  target: String!
  platform: String!
  # Opened under a temporary id after a stage (new keys), not straight under
  # the build id (the build's own keys).
  staged: Boolean!
  # What the latest hello said: the process id, Go's os and arch names, and
  # what else the minion could learn.
  pid: Int!
  os: String!
  arch: String!
  host: String
  user: String
  domain: String
  proc: String
  # What tells this machine apart from others with the same host and user:
  # "<source>:<value>" (smbios-uuid:…, linux-machine-id:…, hostname:…; docs:
  # contracts/minion-messages.md, Machine identity). Null from minions built
  # before hellos had it.
  machineId: String
  # low | medium | high | system (Windows) | root | user
  integrity: String
  addrs: [String!]!
  # The one of addrs the session shows, and sorts by in the addrs column: an
  # operator's pick (addressPicked), shared by the whole team, or core's
  # guess at the host's real one (an ordinary IPv4 network before IPv6,
  # before virtual bridges such as Docker's, before link-local). null when
  # the hello sent none.
  address: String
  addressPicked: Boolean!
  # The IP address the latest message came from, as its channel saw it (the
  # host's NAT's outside address, or the client a trusted proxy forwarded
  # for): the session's current external address. null where the channels
  # gave none.
  peerAddress: String
  # Every external address the session was seen from, most recent first, at
  # most 32.
  peers: [MinionSessionPeer!]!
  version: String
  # The factory's own fields.
  x: JSON
  createdAt: String!
  # Hidden from the operation's sessions, listed with archived: true. A
  # check-in restores it.
  archived: Boolean!
  # How the caller marked it for themselves; null when they did not. Nobody
  # else sees it.
  mark: MinionSessionMark
  # A build persists the session: its minions claim it when they start, so
  # a restarted process comes back here instead of opening a new session.
  persisted: Boolean!
  # The processes that claimed the session (restarts), most recent first, at
  # most 32; restartCount counts them all.
  restarts: [MinionSessionRestart!]!
  restartCount: Int!
  # The check-in schedule the minion last said (its hello's, or a
  # sleep_update): milliseconds between check-ins, and the jitter in percent.
  # null when it never said one.
  sleepInterval: Int
  sleepJitter: Int
  # When the session turns late: its next check-in overdue by that schedule,
  # with a 30 s grace; and lost: three check-ins missed. null without a
  # schedule.
  lateAt: String
  lostAt: String
  # The latest message under the session id; null before the first check-in.
  # While the session is connected it is kept at now.
  lastSeenAt: String
  # A persistent connection serving the session is open (docs:
  # contracts/channel-core-connections): its minion is reached at once.
  connected: Boolean!
  # The connection the minion uses: its place in connections, from 1, as
  # its hello or its last conn_update said. null when it never said.
  conn: Int
  # That connection's kind ("reverse-call", ...) and name, from the build
  # when the minion said it; null when it never said, or the build does not
  # have it.
  connKind: String
  connName: String
  # How many connections the build has.
  connCount: Int!
  # Its moves to another connection, as the minion reported them (whatever
  # moved it: an operator's switch, a fallback), most recent first, at most
  # 32.
  connChanges: [MinionConnChange!]!
  # The build's connections, in the build's order (the order the minion
  # tries them); empty when the build is deleted.
  connections: [MinionConnection!]!
  # How many tasks the minion runs at once, as it last said (its hello, or a
  # max_tasks of its); null when it never said.
  maxTasks: Int
  # The limit can be changed (setMinionSessionMaxTasks): the build's factory
  # declares max tasks. false: its factory sets it, and maxTasks, when the
  # minion says it, only reports it.
  maxTasksSettable: Boolean!
  # The operator's limit while the minion says another: on its way, with
  # every message core sends it. null otherwise.
  maxTasksPending: Int
  # The operator's limit the minion did not take: core sent it with 5
  # messages and the minion never said it has it (a minion that does not
  # know the item). null otherwise; setting it again tries again.
  maxTasksNotTaken: Int
  # The tasks the minion has and has not ended (sent, started).
  runningTasks: Int!
  # Its minion's feedback since it was last marked read (for everyone of the
  # operation): errors and warnings; when the latest came, and when it was
  # marked read. Entries: minionFeedback.
  feedbackErrors: Int!
  feedbackWarnings: Int!
  feedbackAt: String
  feedbackReadAt: String
}

# A warning or an error a session's minion sent its operators (docs:
# contracts/minion-messages/sessions, Feedback): what it would otherwise only
# log on the host.
type MinionFeedback {
  id: ID!
  # warning or error.
  level: String!
  msg: String!
  # The factory's short tag for the kind of problem ("checkin_failed").
  code: String
  # The task it is about, if any.
  taskId: ID
  # When it happened, as the minion says; null when it did not.
  at: String
  # How many times it happened (the minion folds repeats).
  count: Int!
  receivedAt: String!
  # Came after the session's feedback was last marked read.
  unread: Boolean!
}

# A page of feedback, newest first; next is the cursor of the next, null on
# the last.
type MinionFeedbackPage {
  entries: [MinionFeedback!]!
  next: String
}

# One of a session's build's connections.
type MinionConnection {
  # Its place in the build's connections, from 1: what a hello, a
  # conn_update and switch_connection name it by.
  place: Int!
  # What the minion calls it (the endpoint export's name).
  name: String!
  # The channel kind, e.g. "http".
  moduleName: String!
  # The connection kind, e.g. "reverse-call".
  kind: String!
  # The channel's settings as the build gave them (the export's params).
  params: JSON!
}

# A move to another connection a minion reported.
type MinionConnChange {
  at: String!
  # The place it moved from; null when core did not know it.
  from: Int
  to: Int!
  # Why, when the minion said ("fell back after 5 failures").
  reason: String
}

# A process that claimed a persisted session.
type MinionSessionRestart {
  at: String!
  pid: Int!
  host: String
  # The build it ran: the one that persists the session.
  buildId: ID!
}

# An operator's own mark on a session: a color (one of 36, "<hue>-<strength>":
# red, orange, amber, yellow, lime, green, teal, cyan, blue, indigo, violet or
# pink; soft, medium or strong) or in its place a style (haxor, rainbow,
# amber-crt, synthwave, glitch, on-fire, gold or ghost), and an icon (a lucide
# name, or si:<slug>) or an emoji. Each may be null.
type MinionSessionMark {
  color: String
  icon: String
  emoji: String
}

input MinionSessionMarkInput {
  color: String
  icon: String
  emoji: String
}

# One external address a session was seen from.
type MinionSessionPeer {
  address: String!
  firstSeen: String!
  lastSeen: String!
  # The messages from it.
  count: Int!
}

type MinionSessionEdge {
  node: MinionSession!
  cursor: String!
}

type MinionSessionConnection {
  edges: [MinionSessionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# How a filter narrows its column. Which ones a column takes depends on what
# it holds:
#   text (host, user, domain, proc, buildDescription) and the address lists
#   (addrs, peer: any address the session was seen from): CONTAINS, NOT_CONTAINS (text, case aside), EMPTY, NOT_EMPTY
#   a few values (os, arch, version, build: the factory, target,
#   platform) and staged ("true" / "false"): IN, NOT_IN (values)
#   numbers (number, pid): RANGE (min, max; either may be left out)
#   times (lastSeen, opened): WITHIN or OLDER_THAN (seconds before now),
#   NEVER (no value: lastSeen before the first check-in), RANGE (from, to);
#   lastSeen also LIVE (on time by its schedule), LATE (a check-in overdue,
#   not lost yet) and LOST (three missed): a session whose minion never said
#   its schedule is none of them
#   ids (sessionId, buildId): EQUALS (text, a whole UUID)
# A missing value is empty: NOT_IN and NOT_CONTAINS keep it.
enum MinionSessionFilterOp {
  CONTAINS
  NOT_CONTAINS
  EMPTY
  NOT_EMPTY
  IN
  NOT_IN
  RANGE
  WITHIN
  OLDER_THAN
  NEVER
  EQUALS
  LIVE
  LATE
  LOST
}

# One column filter. column is a column id: number, sessionId, addrs, peer
# (the external addresses), host, user (CONTAINS also matches the integrity
# level), domain, proc, pid, os, arch, version, lastSeen, opened, build,
# target, platform, buildDescription, description, buildId, staged,
# persisted, restarts.
input MinionSessionFilterInput {
  column: String!
  op: MinionSessionFilterOp!
  text: String
  values: [String!]
  min: Float
  max: Float
  seconds: Int
  # RFC 3339
  from: String
  to: String
}

type MinionSessionFilter {
  column: String!
  op: MinionSessionFilterOp!
  text: String
  values: [String!]
  min: Float
  max: Float
  seconds: Int
  from: String
  to: String
}

# The sessions a list shows, as a bulk action names them: the view
# (archived or not), the search and the filters.
input MinionSessionMatchInput {
  archived: Boolean
  search: String
  filters: [MinionSessionFilterInput!]
}

# The order of the list: a column id (all but sessionId, addrs and buildId
# sort) and a direction. The session's insertion order breaks ties.
input MinionSessionSortInput {
  column: String!
  direction: SortDirection!
}

type MinionSessionSort {
  column: String!
  direction: SortDirection!
}

# How the caller keeps the Sessions page, one for all operations: the
# table's columns, in order, its sort and filters, and where the divider
# between the list and the session below sits.
type MinionSessionsLayout {
  columns: [String!]!
  # null: newest first.
  sort: MinionSessionSort
  filters: [MinionSessionFilter!]!
  # The share of the page's height the list takes, 0.1 to 0.9; null for the
  # default.
  split: Float
  # The share of a session console's width its task list takes beside the
  # selected task, 0.1 to 0.9; null for the default.
  consoleSplit: Float
  # The share of a file browser's width its folder tree takes, 0.1 to 0.9;
  # null for the default.
  filesSplit: Float
  # The session work pane's text size in pixels, 10 to 12; null for the
  # default (12).
  paneTextSize: Int
  # The effect the operator's console prompt shows as keys are typed and
  # lines run, set with the console's /fx (lightning, inferno); null for
  # none. Core keeps any name of its form (^[a-z][a-z0-9-]{0,31}$); the app
  # shows the effects it knows, none for another.
  promptFx: String
}

input MinionSessionsLayoutInput {
  columns: [String!]!
  sort: MinionSessionSortInput
  filters: [MinionSessionFilterInput!]!
  split: Float
  consoleSplit: Float
  filesSplit: Float
  paneTextSize: Int
  promptFx: String
}

type MinionSessionEvent {
  action: EventAction!
  sessionId: ID!
  operationId: ID!
  session: MinionSession
}

extend type Query {
  # A session's feedback, newest first, a page at a time (first: 200 by
  # default, 500 at most; after: a page's next). level keeps one level's
  # (warning, error); search the entries whose message or code holds it, any
  # case. Needs at least viewer.
  minionFeedback(sessionId: ID!, level: String, search: String, after: String, first: Int): MinionFeedbackPage!
    @hasPermission(permission: "operation:member")

  # An operation's sessions, newest first, a page at a time. search is the
  # app's search (a substring, case aside; "quotes" for whole words) over the
  # host, user, domain, process, os, arch, integrity, addresses, version, the
  # build's description, factory, target and platform; a number ("12",
  # "#12") also matches the session numbered so, and a whole UUID a session
  # or build id. filters all hold; sort is newest first when null, and a
  # cursor is only good for the sort it came with. Needs at least viewer.
  minionSessions(
    operationId: ID!
    # The archived sessions instead of the others.
    archived: Boolean = false
    search: String
    filters: [MinionSessionFilterInput!]
    sort: MinionSessionSortInput
    first: Int = 20
    after: String
    last: Int
    before: String
  ): MinionSessionConnection!
    @hasPermission(permission: "operation:member")

  # One session, closed and reserved ones too; null when there is none.
  # Needs at least viewer of its operation.
  minionSession(id: ID!): MinionSession
    @hasPermission(permission: "operation:member")

  # The distinct values an operation's sessions have in a column of a few
  # values (os, arch, version, build, target, platform, staged),
  # sorted: what its IN filter offers. Needs at least viewer.
  minionSessionValues(operationId: ID!, column: String!): [String!]!
    @hasPermission(permission: "operation:member")

  # The caller's Sessions table layout; null until they change the default.
  minionSessionsLayout: MinionSessionsLayout
    @hasPermission(permission: "user:update:own")
}

extend type Mutation {
  # Archives a session (hidden from the operation's sessions) or restores it,
  # for everyone in the operation; a check-in restores it too. Needs at least
  # operator; agent API keys are rejected.
  setMinionSessionArchived(id: ID!, archived: Boolean!): MinionSession!
    @hasPermission(permission: "operation:member")

  # Archives or restores many of an operation's sessions in one go: those
  # with ids (at most 500), or every one matching (the view, search and
  # filters a list shows). Exactly one of the two. Returns how many changed.
  # Needs at least operator; agent API keys are rejected.
  setMinionSessionsArchived(
    operationId: ID!
    ids: [ID!]
    matching: MinionSessionMatchInput
    archived: Boolean!
  ): Int!
    @hasPermission(permission: "operation:member")

  # Replaces a session's description, at most 500 characters; "" clears it.
  # Needs at least operator; agent API keys are rejected.
  setMinionSessionDescription(id: ID!, description: String!): MinionSession!
    @hasPermission(permission: "operation:member")

  # Marks a session for the caller alone; null, or a mark with nothing set,
  # removes theirs. Needs at least viewer; agent API keys are rejected.
  setMinionSessionMark(id: ID!, mark: MinionSessionMarkInput): MinionSession!
    @hasPermission(permission: "operation:member")

  # Marks many of an operation's sessions alike, for the caller alone: those
  # with ids (at most 500), or every one matching (more than 10000 is
  # refused, not marked in part). Exactly one of the two; returns how many.
  # Needs at least viewer; agent API keys are rejected.
  setMinionSessionsMark(
    operationId: ID!
    ids: [ID!]
    matching: MinionSessionMatchInput
    mark: MinionSessionMarkInput
  ): Int!
    @hasPermission(permission: "operation:member")

  # Picks the address a session shows, one of its addrs, for everyone in the
  # operation; null goes back to core's guess. Needs at least operator; agent
  # API keys are rejected.
  setMinionSessionAddress(id: ID!, address: String): MinionSession!
    @hasPermission(permission: "operation:member")

  # Marks the session's feedback read, for everyone in the operation: its
  # unread counts go back to 0. Needs at least operator; agent API keys are
  # rejected.
  markMinionFeedbackRead(id: ID!): MinionSession!
    @hasPermission(permission: "operation:member")

  # Sets how many tasks the session's minion runs at once, 0 (it takes no new
  # tasks: a pause; what it runs goes on) to 64. Core sends it with every
  # message to the minion, whatever the minion runs, until the minion says it
  # has it (maxTasksPending till then), 5 messages at most (maxTasksNotTaken
  # after); a process that claims the session later gets it too. Only where
  # maxTasksSettable, for a minion whose hello said its limit. Needs at least
  # operator; agent API keys are rejected.
  setMinionSessionMaxTasks(id: ID!, max: Int!): MinionSession!
    @hasPermission(permission: "operation:member")

  # Keeps the caller's Sessions table layout, for every operation and every
  # browser they use; null goes back to the default.
  setMinionSessionsLayout(layout: MinionSessionsLayoutInput): MinionSessionsLayout
    @hasPermission(permission: "user:update:own")
}

extend type Subscription {
  # A session opened, checked in or said hello again.
  minionSessionChanged(operationId: ID!): MinionSessionEvent!
    @hasPermission(permission: "operation:member")
}
