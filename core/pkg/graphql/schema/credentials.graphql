# =============================================================================
# Findings — Credentials
# =============================================================================
#
# Credentials are an operation-scoped record of secrets that operators discover
# on target systems (passwords, keys, certificates, tickets, hashes). They live
# under the "Findings" page in the UI.
#
# Each type has fields of its own: `credentialTypes` lists which each takes and
# requires, and a write with a value in a field its type has not is refused.
#
# Note: the secret fields here are *target* secrets, not application secrets.
# They are stored as plain data and not redacted.

# --- Enums ---

enum CredentialType {
  # username, realm, password (required).
  PLAINTEXT
  # username, key (required), passphrase.
  KEY
  # username, realm, certificate (required), privateKey, password.
  CERTIFICATE
  # username, realm, ticket (required), service, expiresAt.
  TICKET
  # A hash that is a credential by itself (pass-the-hash), unlike a Hash
  # finding, which is one to crack: username, realm, hash (required), algorithm.
  HASH
  # username, realm, hex (required: hex digits), algorithm.
  HEX
  # Anything else: username, password, keys. The shape every credential had
  # before the types had fields of their own; the migration moved the old
  # ones here, keeping their old type in legacyType.
  OTHER
}

# One of a credential's typed fields, as `credentialTypes` lists them. Each
# names the Credential field of the same name (PRIVATE_KEY is privateKey).
enum CredentialField {
  USERNAME
  REALM
  PASSWORD
  KEY
  PASSPHRASE
  CERTIFICATE
  PRIVATE_KEY
  TICKET
  SERVICE
  EXPIRES_AT
  HASH
  HEX
  ALGORITHM
  KEYS
}

# How a field is typed in and shown.
enum CredentialFieldKind {
  # One line of plain text: a username, a realm, a service.
  TEXT
  # One line of secret material: a password, a hash. Shown to copy, in
  # monospace.
  SECRET
  # Secret material of many lines: a key, a certificate, a ticket.
  BLOB
  # An RFC 3339 time: when a ticket expires.
  DATETIME
  # OTHER's list of named keys.
  KEY_LIST
}

# Whether the credential has actually been used against the target.
# UNKNOWN is the default for anything freshly recorded — it is a real answer,
# distinct from INVALID, and the reason this is not a boolean.
enum CredentialValidity {
  UNKNOWN
  VALID
  INVALID
}

# Selectable fields for the credential text search. Passed via the
# `searchFields` argument on the `credentials` / `myCredentials` queries to
# restrict which fields the `search` term matches against. Omitting the
# argument (or passing an empty list) searches all of them — the historical
# default. PROPERTIES matches operator-defined property *values* only; property
# names are deliberately excluded (they're labels, not content).
enum CredentialSearchField {
  NAME
  USERNAME
  REALM
  PASSWORD
  HASH
  HEX
  SERVICE
  ALGORITHM
  PROPERTIES
}

# Sortable columns for the `credentials` / `myCredentials` queries. Only the
# columns the UI exposes as sortable are listed; the default (and the
# historical order) is CREATED_AT descending. NAME and USERNAME sort
# case-insensitively.
enum CredentialSortField {
  NAME
  USERNAME
  CREATED_AT
}

# --- Types ---

type CredentialComment {
  id: ID!
  # Null if the comment's author account was deleted. Mirrors Credential.createdBy.
  author: User
  text: String!
  createdAt: String!
  updatedAt: String!
}

# A named blob of key material attached to an OTHER credential. Operators
# give each key a label so a single credential can carry several keys without
# losing context.
type CredentialKey {
  name: String!
  content: String!
}

# Operator-defined name/value pair for ad-hoc metadata that doesn't fit the
# type's fields (e.g. port=2222, mfa=enabled, source=kerberoast).
# Properties are visible text — not secret material — and participate in
# credential search. Names are unique within a single credential.
type CredentialProperty {
  name: String!
  value: String!
}

type Credential {
  id: ID!
  # Counts the row's changes: of two copies, the one with the higher rev is
  # the newer (a mutation's answer can come after live updates).
  rev: Int!
  operationId: ID!
  # The full parent Operation. Resolved on demand via a DB lookup.
  #
  # Use this in cross-operation views (e.g. the global Findings page) where
  # you need to display which operation a credential belongs to. In scoped
  # views the operation is implicit, so keep using `operationId` and skip
  # this field — it costs a DB round trip per credential when selected.
  operation: Operation!
  name: String!
  type: CredentialType!
  # The type an OTHER credential was recorded under before the types had
  # fields of their own (PASSWORD, SSH_KEY, API_KEY, TOKEN, HASH): a hint for
  # converting it. Null otherwise, and cleared when the type changes.
  legacyType: String
  # The typed fields. A field the type does not take is empty ("", null, []);
  # credentialTypes says which take what.
  username: String!
  realm: String!
  password: String!
  key: String!
  passphrase: String!
  certificate: String!
  privateKey: String!
  ticket: String!
  service: String!
  # RFC 3339.
  expiresAt: String
  hash: String!
  hex: String!
  algorithm: String!
  keys: [CredentialKey!]!
  # Operator-defined metadata key/value pairs. Order is preserved (operators
  # choose the layout). Names are unique within a credential.
  properties: [CredentialProperty!]!
  validity: CredentialValidity!
  tags: [String!]!
  comments: [CredentialComment!]!
  # True when the calling user can moderate (currently: delete) any comment
  # on this credential regardless of authorship. Granted to app-level admins
  # and to admins of the parent operation. Used by the UI to expose a
  # delete action on comments the caller did not write. Comment authors can
  # always delete their own comments; this flag covers everything else.
  viewerCanModerateComments: Boolean!
  # Null for credentials whose creator was deleted.
  createdBy: User
  # Number of active wiki documents in this operation that reference this
  # credential via the /credential slash command. Cheap aggregation — the
  # credentials list pulls this for the table column without fanning out a
  # per-row lookup.
  backlinkCount: Int!
  # Active wiki documents in this operation that reference this credential
  # via the /credential slash command. Trashed referrers are excluded.
  # Capped at 200 most recently updated — past that, refining the source
  # documents is the expected fix, not pagination. Loaded on demand (e.g.
  # when the details dialog opens); not part of the table list payload.
  backlinks: [WikiDocument!]!
  # Where the credential is used: what modules' values name it (credential
  # fields). Loaded on demand (the details dialog, a delete's warning).
  usage: CredentialUsage!
  createdAt: String!
  updatedAt: String!
}

# Where a credential is used. Targets and endpoints name it live: their
# channel gets it at the next call, so editing it reaches them, and deleting
# or converting it leaves them unable to log in. Builds and tasks are
# history: what a minion was built with, or a task carried, stays as it was.
type CredentialUsage {
  targets: [CredentialTargetUse!]!
  endpoints: [CredentialEndpointUse!]!
  builds: Int!
  tasks: Int!
}

type CredentialTargetUse {
  id: ID!
  name: String!
  moduleName: String!
  kind: String!
  buildId: ID!
  # The credential types the target's fields naming it take; empty for any.
  accept: [CredentialType!]!
  # How the credential last fared logging in to the target; null when the
  # channel has not tried it.
  login: CredentialLogin
}

type CredentialEndpointUse {
  id: ID!
  name: String!
  moduleName: String!
  kind: String!
  # The credential types the endpoint's fields naming it take; empty for any.
  accept: [CredentialType!]!
}

# A login with a credential, as a channel reported it.
type CredentialLogin {
  # The target took it; false when it refused it.
  accepted: Boolean!
  at: String!
}

# One field of a credential type.
type CredentialFieldSpec {
  field: CredentialField!
  label: String!
  kind: CredentialFieldKind!
  required: Boolean!
  # What a form shows in the field while it is empty; "" for none.
  hint: String!
}

# A credential type and the fields it takes, in the order to list them.
type CredentialTypeSpec {
  type: CredentialType!
  label: String!
  description: String!
  fields: [CredentialFieldSpec!]!
}

type CredentialEdge {
  node: Credential!
  cursor: String!
}

type CredentialConnection {
  edges: [CredentialEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

type CredentialEvent {
  action: EventAction!
  credentialId: ID!
  operationId: ID!
  credential: Credential
}

# --- Inputs ---

input CredentialKeyInput {
  name: String!
  content: String!
}

input CredentialPropertyInput {
  name: String!
  value: String!
}

# Only the fields the type takes may hold a value; the ones it requires must.
input CreateCredentialInput {
  name: String!
  type: CredentialType!
  username: String
  realm: String
  password: String
  key: String
  passphrase: String
  certificate: String
  privateKey: String
  ticket: String
  service: String
  # RFC 3339; "" clears it.
  expiresAt: String
  hash: String
  # Hex digits; whitespace, colons and a leading 0x are taken out.
  hex: String
  algorithm: String
  # OTHER's named keys.
  keys: [CredentialKeyInput!]
  properties: [CredentialPropertyInput!]
  # Defaults to UNKNOWN: recorded, not yet tried.
  validity: CredentialValidity
  tags: [String!]
}

# Fields left out are kept, and "" (or [] for keys) empties one. A new type
# must have every value the old one holds a field for, or the update is
# refused naming those that would be lost: send them empty to drop them.
# Fields the new type has not are emptied.
input UpdateCredentialInput {
  name: String
  type: CredentialType
  username: String
  realm: String
  password: String
  key: String
  passphrase: String
  certificate: String
  privateKey: String
  ticket: String
  service: String
  # RFC 3339; "" clears it.
  expiresAt: String
  hash: String
  # Hex digits; whitespace, colons and a leading 0x are taken out.
  hex: String
  algorithm: String
  # OTHER's named keys.
  keys: [CredentialKeyInput!]
  properties: [CredentialPropertyInput!]
  validity: CredentialValidity
  tags: [String!]
}

# --- Queries ---

extend type Query {
  # The credential types and which fields each takes. The same for everyone,
  # so it carries no operation.
  credentialTypes: [CredentialTypeSpec!]!

  # Single credential by ID. Resolver checks operation membership.
  credential(id: ID!): Credential!
    @hasPermission(permission: "operation:member")

  # Cursor-paginated list of credentials scoped to an operation.
  credentials(
    operationId: ID!
    search: String
    # Restricts which fields `search` matches. Null/empty = all fields.
    searchFields: [CredentialSearchField!]
    type: CredentialType
    # Restricts to any of these types (a picker for a field that takes
    # several). Null/empty = every type; with type, both apply.
    types: [CredentialType!]
    tags: [String!]
    # Restricts to these validity states. Null/empty = every state. The UI
    # default is [UNKNOWN, VALID] — an untested credential is still worth
    # seeing; only one known not to work is worth hiding.
    validity: [CredentialValidity!]
    # Column + direction ordering the list. Cursors are sort-specific:
    # changing the sort restarts pagination (see SortDirection).
    sortBy: CredentialSortField = CREATED_AT
    sortDirection: SortDirection = DESC
    first: Int = 20
    after: String
    last: Int
    before: String
  ): CredentialConnection!
    @hasPermission(permission: "operation:member")

  # Deduplicated tag set across all credentials in the operation.
  # Used to drive the tag filter / autocomplete UI.
  credentialTags(operationId: ID!): [String!]!
    @hasPermission(permission: "operation:member")

  # Cross-operation credentials list — powers the "global" Findings page.
  #
  # Note: this field intentionally has **no** @hasPermission directive. The
  # directive can only enforce a single operation_id, but this query spans
  # several operations. Authorization is performed by the resolver, which
  # verifies the caller's role in **every** operation referenced in the
  # result set:
  #   - operationIds = null  → resolver derives the caller's membership set
  #                            via the operation repository and queries those.
  #   - operationIds = []    → returns an empty connection without hitting DB.
  #   - operationIds = [...] → resolver authorizes each op (viewer minimum)
  #                            and returns 403 if any is not accessible.
  #
  # The list is capped server-side; passing more than the cap (currently 100)
  # returns an error. Use the standard filters (search/type/tags/validity) on
  # top — they apply across the union.
  myCredentials(
    operationIds: [ID!]
    search: String
    # Restricts which fields `search` matches. Null/empty = all fields.
    searchFields: [CredentialSearchField!]
    type: CredentialType
    # Restricts to any of these types (a picker for a field that takes
    # several). Null/empty = every type; with type, both apply.
    types: [CredentialType!]
    tags: [String!]
    # Restricts to these validity states. Null/empty = every state. The UI
    # default is [UNKNOWN, VALID] — an untested credential is still worth
    # seeing; only one known not to work is worth hiding.
    validity: [CredentialValidity!]
    # Column + direction ordering the list. Cursors are sort-specific:
    # changing the sort restarts pagination (see SortDirection).
    sortBy: CredentialSortField = CREATED_AT
    sortDirection: SortDirection = DESC
    first: Int = 20
    after: String
    last: Int
    before: String
  ): CredentialConnection!

  # Deduplicated tag set across credentials in the given operations.
  # Same authorization model as myCredentials.
  myCredentialTags(operationIds: [ID!]): [String!]!
}

# --- Mutations ---

extend type Mutation {
  # createCredential creates a new credential in an operation.
  # Requires at least operator role in the operation.
  createCredential(operationId: ID!, input: CreateCredentialInput!): Credential!
    @hasPermission(permission: "operation:member")

  # updateCredential modifies an existing credential.
  # Requires at least operator role in the operation.
  updateCredential(id: ID!, input: UpdateCredentialInput!): Credential!
    @hasPermission(permission: "operation:member")

  # deleteCredential removes a credential by ID.
  # Requires at least operator role in the operation.
  deleteCredential(id: ID!): Boolean!
    @hasPermission(permission: "operation:member")

  # addCredentialComment appends a comment to a credential.
  # Requires at least operator role in the operation.
  addCredentialComment(credentialId: ID!, text: String!): Credential!
    @hasPermission(permission: "operation:member")

  # updateCredentialComment edits an existing comment.
  # Author can edit own comments; operation admins can edit any comment.
  updateCredentialComment(credentialId: ID!, commentId: ID!, text: String!): Credential!
    @hasPermission(permission: "operation:member")

  # deleteCredentialComment removes a comment from a credential.
  # Author can delete own comments; operation admins can delete any comment.
  deleteCredentialComment(credentialId: ID!, commentId: ID!): Credential!
    @hasPermission(permission: "operation:member")
}

# --- Subscriptions ---

extend type Subscription {
  # Real-time credential changes scoped to an operation.
  credentialChanged(operationId: ID!): CredentialEvent!
    @hasPermission(permission: "operation:member")

  # Real-time credential changes across multiple operations. Sibling of
  # myCredentials — powers the global Findings page.
  #
  # Like myCredentials, this field has **no** @hasPermission directive. The
  # directive can only enforce a single operation_id, but this subscription
  # spans several operations. Authorization is performed by the resolver at
  # subscribe time, with the same semantics:
  #
  #   - operationIds = null  → resolver derives the caller's membership set
  #                            via the operation repository and filters
  #                            incoming events to that set.
  #   - operationIds = []    → connect succeeds and never emits.
  #   - operationIds = [...] → resolver authorizes each op (viewer minimum)
  #                            and returns 403 if any is not accessible. Only
  #                            events whose operation_id is in the set are
  #                            delivered.
  #
  # The membership set is captured at subscribe time. If the caller joins or
  # leaves an operation while a "nil" subscription is live, they need to
  # reconnect to pick up the new membership set — same constraint as
  # operationChanged.
  myCredentialChanged(operationIds: [ID!]): CredentialEvent!
}
