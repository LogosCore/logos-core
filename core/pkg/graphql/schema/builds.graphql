# =============================================================================
# Minion builds — factories, build files, builds and minions
# =============================================================================
#
# A factory declares a build schema at module.register (see
# logos-golang-protocol/protocol/build.go and the docs repo's
# contracts/minion-build.md): its targets, their fields, the channel kinds its
# minions speak with the factory's own connection parameters for each. The
# schema belongs to the factory kind (module name, e.g. "bob"); a kind's
# current schema is the highest version any of its instances declared.
#
# An operation keeps build files (uploads for file fields, through
# POST /api/v1/build-files). A build's connections hold their own settings, by
# each channel's connection schema; the form can fill one from an endpoint,
# which copies it, and an earlier build fills the whole form ("Build again").
# A build asks a factory
# instance for one minion: core queues it, offers it to a live instance, follows
# its progress and result, checks the artifact, and a successful build creates
# the minion. Its artifact downloads from GET /api/v1/builds/{id}/artifact.
#
# Viewers of an operation read all of it; operators and admins upload, build,
# cancel and delete. Agent API keys may read but not write.

extend type Module {
  # The build schema this instance declared; null when it declared none (only
  # factories do).
  build: BuildSchema
}

type BuildSchema {
  # Version of the factory kind's parameter set.
  version: Int!
  # Channel kinds the minions speak.
  channels: [BuildChannel!]!
  # Payload crypto suites the minions implement.
  crypto: [String!]!
  # Build parameters every target shares.
  fields: [ModuleField!]!
  targets: [BuildTarget!]!
}

type BuildChannel {
  moduleName: String!
  # Connection schema versions the minions read.
  versions: [Int!]!
  # The factory's connection parameters for this channel kind, set per
  # connection of a build.
  fields: [ModuleField!]!
}

type BuildChannelVersions {
  moduleName: String!
  versions: [Int!]!
}

type BuildTarget {
  id: String!
  label: String!
  description: String
  # What the artifact is: exe, dll, elf, bin, json, ...
  format: String!
  # os/arch pairs, Go names; "any" stands for either half.
  platforms: [String!]!
  # The target's own fields; BuildSchema.fields come first.
  fields: [ModuleField!]!
  # The channel kinds this target can connect through.
  channels: [BuildChannelVersions!]!
}

# A factory kind minions can be built with.
type FactoryKind {
  # The kind, e.g. "bob".
  moduleName: String!
  schema: BuildSchema!
  # Registered instances declaring the current schema version; a build needs
  # one.
  instances: Int!
  # The SVG icon the kind's latest registration that sent one carried (see
  # Module.icon); empty when none did, and the UI shows the default.
  icon: String!
}

# A file uploaded for a build's file fields.
type BuildFile {
  id: ID!
  operationId: ID!
  name: String!
  size: Int!
  sha256: String!
  mediaType: String
  uploadedBy: ModuleActor!
  createdAt: String!
}

type BuildProblem {
  # Where the problem is: "description", "target", "platform", "values.<key>",
  # "connections", "connections[<i>]", "connections[<i>].name",
  # "connections[<i>].description", "connections[<i>].settings.<key>",
  # "connections[<i>].values.<key>"; null when it is not one place's.
  key: String
  message: String!
}

# One connection of a build: a channel kind, its connection settings and the
# factory's connection parameters for it.
input BuildConnectionInput {
  # The channel kind; the target must connect through it.
  moduleName: String!
  # What the minion calls the connection, a slug like an endpoint name, unique
  # among the connections; empty: "<channel>-<position>".
  name: String
  # A note for the team on what the connection is for, at most 500
  # characters. Core keeps it with the build record and never sends it to the
  # factory, so it cannot end up in an artifact.
  description: String
  # Connection settings by the channel's connection schema field key. null, ""
  # and [] leave a setting unset (its default applies).
  settings: JSON
  # The factory's connection parameter values by key, the same way.
  values: JSON
}

input BuildInput {
  # What the build is for, 1 to 500 characters: the operators' note. Core
  # keeps it with the build record and never sends it to the factory, so it
  # cannot end up in an artifact.
  description: String!
  moduleName: String!
  target: String!
  platform: String!
  # Values by field key; null, "" and [] leave a field unset (its default
  # applies). File fields take build file ids.
  values: JSON!
  # The connections, in the order the minion tries them.
  connections: [BuildConnectionInput!]!
}

# One stage of a build's pipeline: core's queue, then the factory's steps
# (its plan for the build, sent when it took it), then core's artifact check.
# A step the factory has not reported yet is taken as done once it reports a
# later one.
type BuildStage {
  # The factory's step id, or core's own: "core.queue", "core.check".
  id: String!
  label: String!
  # Core's own stage (the queue, the artifact check), not the factory's.
  core: Boolean!
  # PENDING | RUNNING | SUCCEEDED | FAILED | CANCELLED | SKIPPED (not run:
  # the build ended before it)
  state: String!
  # The factory's latest message for its step.
  message: String
  # Null when not known: a step done without being reported has no times.
  startedAt: String
  finishedAt: String
}

type BuildArtifact {
  filename: String!
  size: Int!
  sha256: String!
  mediaType: String
  # The bytes were deleted; the record stays.
  deleted: Boolean!
}

type BuildError {
  # The factory's own code, or core's: timeout, factory_lost,
  # artifact_mismatch, schema_changed, refused.
  code: String!
  message: String!
}

type Build {
  # The build's id, and the minion's: factories know the build by it, and the
  # minion sends it on the data plane.
  id: ID!
  operationId: ID!
  # What the build is for: the operators' note, core's own (see
  # BuildInput.description). Empty for a build made before it was required.
  description: String!
  # The factory kind.
  moduleName: String!
  target: String!
  platform: String!
  schemaVersion: Int!
  # Every field with a value or a default, as the factory got them.
  values: JSON!
  # The connections as the factory got them: [{endpoint: <export>, values:
  # {...}}], each export's params resolved over the channel's defaults.
  connections: JSON!
  # The operators' notes on the connections, by position ("" for none). Core's
  # own: the factory never got them, so they are not in connections.
  connectionDescriptions: [String!]!
  # QUEUED | BUILDING | SUCCEEDED | FAILED | CANCELLED
  state: String!
  # The factory instance building it.
  instance: String
  factoryVersion: String
  # The build's pipeline, in order.
  stages: [BuildStage!]!
  artifact: BuildArtifact
  capabilities: [String!]!
  warnings: [String!]!
  # The build output, its last 64 KiB.
  log: String
  error: BuildError
  createdBy: ModuleActor!
  cancelledBy: ModuleActor
  createdAt: String!
  startedAt: String
  finishedAt: String
  # When core stops waiting: for a factory to take it, then for its result.
  deadline: String!
}

# What a successful build created. Its id is its build's.
type Minion {
  id: ID!
  operationId: ID!
  # The factory kind that built it.
  moduleName: String!
  target: String!
  platform: String!
  capabilities: [String!]!
  createdBy: ModuleActor!
  createdAt: String!
}

extend type Query {
  # Factory kinds that declared a build schema, with their current one.
  factoryKinds: [FactoryKind!]!
    @hasPermission(permission: "operation:member")

  # An operation's build files, newest first. Needs at least viewer.
  buildFiles(operationId: ID!): [BuildFile!]!
    @hasPermission(permission: "operation:member")

  # An operation's builds, newest first, at most limit (default 50). With a
  # search, the builds that hold every word of it, case aside, in what the
  # Builds page shows of them (factory, target, id, description, the stage
  # they are on or stopped at, platform, who started them), their state,
  # factory instance, error and artifact name, or what they were made of:
  # their values and their connections' names, channels, settings, values and
  # descriptions. Needs at least viewer.
  builds(operationId: ID!, limit: Int, search: String): [Build!]!
    @hasPermission(permission: "operation:member")

  # One build; null when it does not exist. Needs at least viewer.
  build(id: ID!): Build
    @hasPermission(permission: "operation:member")

  # An operation's minions, newest first. Needs at least viewer.
  minions(operationId: ID!): [Minion!]!
    @hasPermission(permission: "operation:member")
}

extend type Mutation {
  # Fails while a build refers to the file. Needs at least operator; agent API
  # keys are rejected.
  deleteBuildFile(id: ID!): Boolean!
    @hasPermission(permission: "operation:member")

  # Queues a build. Validated against the kind's current schema; problems are
  # in the error's extensions.problems. Needs at least operator; agent API
  # keys are rejected.
  createBuild(operationId: ID!, input: BuildInput!): Build!
    @hasPermission(permission: "operation:member")

  # Stops a queued or running build.
  cancelBuild(id: ID!): Build!
    @hasPermission(permission: "operation:member")

  # Removes a finished build's artifact bytes; the build stays.
  deleteBuildArtifact(id: ID!): Build!
    @hasPermission(permission: "operation:member")
}
