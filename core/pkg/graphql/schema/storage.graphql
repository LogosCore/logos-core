# The object store core keeps its files in (docs: Storage), as admins see it
# on the Storage page (pkg/storage): SeaweedFS's state, when core is set to
# reach its master (SEAWEEDFS_MASTER_URL); what core's records say it keeps
# in each bucket; and what would make writes fail. Core reads it once a
# minute.
type StorageStatus {
  # When core read it.
  at: String!
  seaweedfs: StorageSeaweedFS!
  # The volume servers' disks.
  disks: [StorageDisk!]!
  # Core's buckets in its order, then those not core's, SeaweedFS's own
  # last.
  buckets: [StorageBucket!]!
  # What an admin should know, the worst first.
  warnings: [StorageWarning!]!
  # Why core could not read its own records; null when it could.
  recordsError: String
}

# SeaweedFS as its master says.
type StorageSeaweedFS {
  # Core has the master's URL; reachable: it answered, else error says why.
  configured: Boolean!
  reachable: Boolean!
  error: String
  version: String
  leader: String
  # The volumes the volume servers have room for (about one a GB of free
  # disk), and those not taken: a bucket that needs a new volume when none
  # is free fails its writes.
  slots: Int!
  freeSlots: Int!
}

# One of a volume server's disks: its bytes, whatever uses them.
type StorageDisk {
  # The volume server (host:port) and its directory; error says why its
  # disks could not be read (no directory then).
  node: String!
  dir: String
  error: String
  total: Int!
  used: Int!
  free: Int!
  # The server's volumes, and those it has room for.
  volumes: Int!
  maxVolumes: Int!
}

# One of the store's buckets: SeaweedFS's numbers for it (a bucket is a
# collection), and core's records of what it keeps there.
type StorageBucket {
  # "" is SeaweedFS's own: volumes written outside any bucket.
  name: String!
  # What core keeps there: minion_files, recordings, builds, wiki_images,
  # wiki_files, skills; empty for a bucket not core's.
  purposes: [String!]!
  # Its volumes, those new files go to, and those full or read-only; none
  # before its first write.
  volumes: Int!
  writableVolumes: Int!
  readOnlyVolumes: Int!
  # Its volumes' bytes on disk, and the part of them deleted files hold
  # until reclaimed (reclaimStorage).
  size: Int!
  deletedBytes: Int!
  # What core's records say it keeps there.
  objects: Int!
  objectBytes: Int!
}

# Something about the store an admin should know.
type StorageWarning {
  # error (writes fail, or core cannot tell), warning (they will soon) or
  # info (space to win back).
  level: String!
  code: String!
  # The bucket it is about; null for the store's.
  bucket: String
  message: String!
}

# What core keeps in a bucket for one operation, of one kind.
type StorageConsumer {
  # Null for what is no operation's (skills); operationName null for an
  # operation gone.
  operationId: ID
  operationName: String
  purpose: String!
  # Its kind within the purpose: minion files' upload, screenshot or
  # download; recordings' desktop or terminal; builds' file or artifact;
  # wiki images' image; wiki files' file; skills' version.
  kind: String!
  objects: Int!
  bytes: Int!
}

type StorageConsumerEdge {
  node: StorageConsumer!
  cursor: String!
}

type StorageConsumerConnection {
  edges: [StorageConsumerEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# A maintenance action run on the store: an admin's, or the retention
# policy's.
type StorageAction {
  id: ID!
  # reclaim (every bucket's volumes), grow (a volume added to bucket) or
  # cleanup (a retention cleanup of recordings: bucket is theirs).
  action: String!
  bucket: String
  # An admin, or the retention policy (type system, id retention_policy).
  actor: ModuleActor!
  # running, succeeded or failed (error says why).
  status: String!
  error: String
  startedAt: String!
  finishedAt: String
  # A reclaim's bytes taken off the disk; a grow's volumes added.
  freed: Int!
  volumes: Int!
  # A cleanup's: the age it takes recordings at, in days, and so the time
  # they ended before; the operation it covers (null: every operation),
  # named as it was when it ran; the recordings it took and their bytes,
  # as it goes.
  olderThanDays: Int
  before: String
  operationId: ID
  operationName: String
  recordings: Int!
  bytes: Int!
}

type StorageActionEdge {
  node: StorageAction!
  cursor: String!
}

type StorageActionConnection {
  edges: [StorageActionEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

# The retention policy (docs: Storage, Retention cleanups), one for every
# operation: on, core runs a cleanup each day of the recordings that ended
# olderThanDays ago, but those of tasks marked important. Off until an
# admin turns it on.
type StorageRetention {
  enabled: Boolean!
  olderThanDays: Int!
  # Who set it last, and when: null before anyone did.
  updatedAt: String
  updatedBy: ModuleActor
  # Its last cleanup, and when the next is due (null while it is off): a
  # day after the last began, an hour after one that failed ended.
  lastRun: StorageAction
  nextRunAt: String
}

# What a cleanup would take now: the recordings that ended before before
# (olderThanDays ago), but those of tasks marked important and those still
# recording; in all, and by operation.
type StorageCleanupPreview {
  olderThanDays: Int!
  before: String!
  recordings: Int!
  bytes: Int!
  # The operations it takes recordings of, the most bytes first, a page at
  # a time.
  operations: StorageCleanupOperationConnection!
}

# What a cleanup would take of one operation's recordings.
type StorageCleanupOperation {
  operationId: ID!
  # Null for an operation gone.
  operationName: String
  recordings: Int!
  bytes: Int!
}

type StorageCleanupOperationEdge {
  node: StorageCleanupOperation!
  cursor: String!
}

type StorageCleanupOperationConnection {
  edges: [StorageCleanupOperationEdge!]!
  pageInfo: PageInfo!
  totalCount: Int!
}

extend type Query {
  # The store as core last read it, at most a minute ago. Needs
  # storage:read (admins).
  storageStatus: StorageStatus!
    @hasPermission(permission: "storage:read")

  # What core keeps in a bucket, the largest first, a page at a time;
  # search matches the operation's name and the kind. Needs storage:read.
  storageConsumers(bucket: String!, search: String, first: Int = 50, after: String): StorageConsumerConnection!
    @hasPermission(permission: "storage:read")

  # The maintenance actions run on the store, the latest first. Needs
  # storage:read.
  storageActions(first: Int = 50, after: String, last: Int, before: String): StorageActionConnection!
    @hasPermission(permission: "storage:read")

  # The retention policy. Needs storage:read.
  storageRetention: StorageRetention!
    @hasPermission(permission: "storage:read")

  # What a cleanup at an age in days (1 to 3650) would take now, its
  # operations a page at a time. Nothing is deleted. Needs storage:manage
  # (admins).
  storageCleanupPreview(olderThanDays: Int!, first: Int = 50, after: String): StorageCleanupPreview!
    @hasPermission(permission: "storage:manage")
}

extend type Mutation {
  # Reclaims the space deleted files hold: compacts every volume, of every
  # bucket, that they hold a tenth of. It runs in the background: the action
  # comes back running. Needs storage:manage (admins).
  reclaimStorage: StorageAction!
    @hasPermission(permission: "storage:manage")

  # Adds a writable volume to a bucket, one of core's or one SeaweedFS has.
  # A failure, as when no volume slot is free, is the action's. Needs
  # storage:manage.
  growStorageBucket(bucket: String!): StorageAction!
    @hasPermission(permission: "storage:manage")

  # Turns the retention policy on or off, at an age in days (1 to 3650).
  # Turned on, its first cleanup starts now, unless it ran within the day.
  # Needs storage:manage.
  setStorageRetention(enabled: Boolean!, olderThanDays: Int!): StorageRetention!
    @hasPermission(permission: "storage:manage")

  # Starts a cleanup of the recordings that ended at least olderThanDays
  # ago (1 to 3650), of one operation (null: of every one), but those of
  # tasks marked important: their files are deleted, their records kept,
  # marked cleaned up. It runs in the background: the action comes back
  # running. One cleanup runs at a time. Needs storage:manage.
  cleanUpStorage(olderThanDays: Int!, operationId: ID): StorageAction!
    @hasPermission(permission: "storage:manage")
}
