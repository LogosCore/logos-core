upstream backend {
    server core-dev:8002;
}

upstream hocuspocus {
    server hocuspocus:1234;
}

upstream frontend {
    server frontend-dev:5173;
}

# Plain HTTP listener — serves the full app, not a redirect, so local
# clients that don't trust the self-signed cert (MCP clients, scripts, Node's
# fetch) can use http://localhost:8080. Browsers should still prefer 8443 for
# HTTP/2.
server {
    listen 80 default_server;
    server_name _;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    include /etc/nginx/logos-locations.conf;
}

# HTTPS + HTTP/2 — the real entrypoint for browsers. HTTP/2 multiplexes all
# requests (including SSE subscription streams and graphql-ws upgrades) over
# a single TCP connection per origin, so the old 6-connection HTTP/1.1 cap
# stops dictating subscription topology.
server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/localhost.crt;
    ssl_certificate_key /etc/nginx/certs/localhost.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    include /etc/nginx/logos-locations.conf;
}
