# Routes shared by the plain HTTP (80) and HTTPS (443) servers in
# default.conf. Mounted outside conf.d so nginx does not load it at the
# http level on its own.

# Hocuspocus WebSocket — MUST come before /api/ to match first. Browser
# uses wss:// on 8443 (nginx terminates TLS) or ws:// on 8080; either way
# it reaches the upstream as plain ws:// on the docker network.
location /api/v1/ws/wiki/ {
    proxy_pass http://hocuspocus;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

# graphql-ws WebSocket transport — single multiplexed channel for all
# GraphQL subscriptions. Same upgrade dance as Hocuspocus; the client
# ships subscription operations over the connection as graphql-ws frames.
location = /api/v1/graphql/ws {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 86400s;
}

# Task files (POST /api/v1/minion-files): a file to send a minion, up to
# MINION_FILE_MAX_SIZE (2 GiB by default). Passed to core as it comes, not
# buffered to disk first: core streams it into the minion files bucket and
# enforces the size itself.
location = /api/v1/minion-files {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 2100M;
}

# Minion streams (/api/v1/minion-streams/{task}): a file of any size,
# downloaded (GET) or uploaded (PUT) as it goes to or from the minion. No
# body limit and nothing buffered: core paces the bytes by the minion's, and
# a stream may wait for the minion's next check-in before any byte moves.
location ^~ /api/v1/minion-streams/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    client_max_body_size 0;
}

# Go backend REST + GraphQL (including legacy SSE subscriptions on
# POST /graphql with Accept: text/event-stream — disable proxy buffering
# so frames flush immediately).
location /api/ {
    proxy_pass http://backend;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;  # keep the port: core derives the OIDC callback URL from it
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    chunked_transfer_encoding off;
    # Match the largest backend upload cap (WIKI_IMPORT_ZIP_MAX_SIZE=200 MB,
    # used by the Outline-export importer). Per-endpoint caps (10 MB images,
    # 50 MB files, 200 MB import zip) stay enforced by the Go handlers; this
    # just stops nginx's 1 MB default from returning 413 before the request
    # reaches them.
    client_max_body_size 200M;
}

# Swagger UI
location /swagger/ {
    proxy_pass http://backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# Frontend (Vite dev server + HMR WebSocket)
location / {
    proxy_pass http://frontend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}
