{{- if .Values.core.enabled -}}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "logos.core.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "logos.labels" . | nindent 4 }}
    app.kubernetes.io/component: core
spec:
  type: {{ .Values.core.service.type }}
  ports:
    - name: http
      port: {{ .Values.core.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "logos.core.selectorLabels" . | nindent 4 }}
{{- end -}}
