name: Publish Frontend Image

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/publish-frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/publish-frontend.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: logoscore/logos-frontend
  # ci-frontend.yml's, and frontend/Dockerfile's NODE_VERSION: keep them in step.
  NODE_VERSION: "22"

jobs:
  build-and-push:
    name: Build and push frontend image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The app built here, not in the image (frontend/Dockerfile's prebuilt
      # stage), with ci-frontend.yml's node_modules cache (its key). Built in
      # the image, npm ci ran again whenever the node image moved (156s of
      # round 37's 281s), and its layer went up to the registry cache again.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore node_modules
        id: modules
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node${{ env.NODE_VERSION }}-${{ hashFiles('frontend/package.json', 'frontend/package-lock.json', 'frontend/patches/**') }}

      - name: Install
        if: steps.modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      # Into ci-dist/, the directory the image's prebuilt stage copies, less
      # its placeholder.
      - name: Build the app
        working-directory: frontend
        run: |
          npm run build
          rm ci-dist/.keep
          cp -a dist/. ci-dist/

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=logos-frontend
            org.opencontainers.image.description=Logos web frontend (static SPA served by nginx)
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Proprietary

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The app comes built (ci-dist/): what is left is nginx and a copy,
          # so no layer cache, whose export took 5 to 44s.
          build-args: |
            DIST_FROM=prebuilt
