name: Frontend CI

# Tests, static analysis and a bundle budget for the SPA. This is the gate
# publish-frontend.yml does not provide: that workflow only builds and pushes the
# image, so nothing ran vitest or eslint on any push or pull request. Two tests
# had sat failing on main because of it — both wrong about the behaviour rather
# than describing a bug, and both wrong in a way that says they never passed.
#
# `npm run build` is `tsc -b && vite build`, so type errors were in fact caught,
# by the image build. Everything else was not.
on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  pull_request:
    branches:
      - main
    paths:
      - "frontend/**"
      - ".github/workflows/ci-frontend.yml"
  workflow_dispatch:

# A newer push to the same branch makes an in-flight run obsolete.
concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

# Must track NODE_VERSION in frontend/Dockerfile. CI builds what the image build
# builds, or CI is not testing the thing that ships. There is no .nvmrc to read
# it from — the Dockerfile ARG is the existing pin, so keep the two in step.
env:
  NODE_VERSION: "22"

defaults:
  run:
    working-directory: frontend

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it installs exactly the lockfile and
      # fails if the two have drifted, which is the check we want in CI. It also
      # runs the postinstall, which is patch-package applying patches/.
      - name: Install
        run: npm ci

      - name: Test
        run: npm run test:run

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # eslint.config.js includes eslint-plugin-react-hooks v7, whose rules are
      # the React Compiler's own analysis. A component it cannot compile shows up
      # here as `react-hooks/incompatible-library` — a warning, not an error, so
      # it reports the un-memoized components without failing the build.
      - name: ESLint
        run: npm run lint

  bundle:
    name: Build and bundle budget
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      # Also the typecheck: the build script is `tsc -b && vite build`.
      - name: Build
        run: npm run build

      # Fails when the first-paint critical path grows past its budget. The
      # regressions this catches are static imports reaching into the app shell,
      # which look like nothing in a diff and put hundreds of KB in front of the
      # login screen. See the script for the budgets and the reasoning.
      - name: Bundle budget
        run: npm run budget
