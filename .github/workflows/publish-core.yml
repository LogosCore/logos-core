name: Publish Core Image

on:
  push:
    branches:
      - main
    paths:
      - "core/**"
      # The image embeds the HTML export's viewer, built from the frontend.
      - "frontend/**"
      - ".github/workflows/publish-core.yml"
  pull_request:
    branches:
      - main
    paths:
      - "core/**"
      # The image embeds the HTML export's viewer, built from the frontend.
      - "frontend/**"
      - ".github/workflows/publish-core.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: logoscore/logos-core

jobs:
  build-and-push:
    name: Build and push core image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The HTML export's offline viewer is a frontend build that the core
      # binary embeds (core/pkg/wikitransfer/htmlbundle/viewer). It is not
      # committed, so it is built here, into the Docker context, before the
      # image. Without it the image still builds, and HTML export fails with
      # a message saying the viewer is missing.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build the HTML export viewer
        working-directory: frontend
        run: |
          npm ci
          npm run build:viewer

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=logos-core
            org.opencontainers.image.description=Logos operations platform — core backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Proprietary

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
