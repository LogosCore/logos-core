name: Publish Core Image

on:
  push:
    branches:
      - main
    paths:
      - "core/**"
      # The image embeds the HTML export's viewer, built from the frontend.
      - "frontend/**"
      - ".github/workflows/publish-core.yml"
  pull_request:
    branches:
      - main
    paths:
      - "core/**"
      # The image embeds the HTML export's viewer, built from the frontend.
      - "frontend/**"
      - ".github/workflows/publish-core.yml"
  workflow_dispatch:

env:
  # Our own modules straight from GitHub, not through the public Go proxy:
  # a tag builds the moment it is pushed. go.sum still checks them.
  GOPRIVATE: "github.com/logoscore/*"
  REGISTRY: ghcr.io
  IMAGE_NAME: logoscore/logos-core

jobs:
  build-and-push:
    name: Build and push core image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The HTML export's offline viewer is a frontend build that the core
      # binary embeds (core/pkg/wikitransfer/htmlbundle/viewer). It is not
      # committed, so it is built here, into the Docker context, before the
      # image. Without it the image still builds, and HTML export fails with
      # a message saying the viewer is missing.
      #
      # Kept between runs, keyed on every frontend file: a push that leaves
      # the frontend alone, as most core changes do, reuses the last build
      # instead of two minutes of npm ci and three vite builds.
      - name: Restore the viewer
        id: viewer
        uses: actions/cache@v4
        with:
          path: core/pkg/wikitransfer/htmlbundle/viewer
          key: html-viewer-${{ hashFiles('frontend/**', '!frontend/node_modules/**') }}

      - name: Set up Node
        if: steps.viewer.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # The same node_modules cache as ci-frontend.yml's (its key).
      - name: Restore node_modules
        id: modules
        if: steps.viewer.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: frontend/node_modules
          key: node-modules-${{ runner.os }}-node22-${{ hashFiles('frontend/package.json', 'frontend/package-lock.json', 'frontend/patches/**') }}

      - name: Install
        if: steps.viewer.outputs.cache-hit != 'true' && steps.modules.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm ci

      - name: Build the HTML export viewer
        if: steps.viewer.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npm run build:viewer

      # The binary built here, not in the image (core/Dockerfile's prebuilt
      # stage): with Go's build cache, saved under each commit and restored
      # from the newest, only what changed compiles, where the image's own
      # build took a minute every time. After the viewer, which it embeds.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: core/go.mod
          cache: false

      - name: Go caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: core-image-${{ runner.os }}-${{ hashFiles('core/go.sum') }}-${{ github.sha }}
          restore-keys: |
            core-image-${{ runner.os }}-${{ hashFiles('core/go.sum') }}-
            core-image-${{ runner.os }}-

      # The flags core/Dockerfile's builder builds with.
      - name: Build the binary
        working-directory: core
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: >-
          go build -trimpath
          -ldflags="-s -w -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }} -X main.buildDate=${{ github.event.repository.updated_at }}"
          -o ci-bin/logos-core .

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=logos-core
            org.opencontainers.image.description=Logos operations platform — core backend
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Proprietary

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./core
          file: ./core/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # No layer cache: exporting it took 37s and saved only go mod
          # download (about 10s); the Go build itself changes every commit.
          build-args: |
            BINARY_FROM=prebuilt
            VERSION=${{ github.ref_name }}
            COMMIT=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
