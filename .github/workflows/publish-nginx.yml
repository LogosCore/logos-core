name: Publish nginx Image

# logos-nginx: core's front (deploy/nginx), its routes kept with core's code.
on:
  push:
    branches:
      - main
    paths:
      - "deploy/nginx/**"
      - ".github/workflows/publish-nginx.yml"
  pull_request:
    branches:
      - main
    paths:
      - "deploy/nginx/**"
      - ".github/workflows/publish-nginx.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: logoscore/logos-nginx

jobs:
  build-and-push:
    name: Build, check and push the nginx image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The image starts, makes its certificate, and nginx takes the
      # configuration (upstreams resolved: stand-in hosts on the runner).
      - name: Check the configuration
        run: |
          docker build -t logos-nginx:check ./deploy/nginx
          for mode in serve redirect; do
            docker run --rm --add-host core:127.0.0.1 --add-host frontend:127.0.0.1 --add-host hocuspocus:127.0.0.1 \
              -e LOGOS_HTTP=$mode --entrypoint sh logos-nginx:check \
              -c '/docker-entrypoint.d/20-envsubst-on-templates.sh && /docker-entrypoint.d/25-logos-front.sh && nginx -t'
          done

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=logos-nginx
            org.opencontainers.image.description=Logos core's front: nginx with core's routes, TLS and the modules' WebSockets
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Proprietary

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./deploy/nginx
          file: ./deploy/nginx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Layers cached in the registry, beside the image: the Actions cache
          # (10 GB a repo, shared with CI's caches) kept evicting them, and a
          # registry cache is neither counted there nor evicted. Pull requests
          # read it and write nothing (no login).
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
          cache-to: ${{ github.event_name != 'pull_request' && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || '' }}
