# Production frontend nginx.
#
# Serves the built Vite SPA over plain HTTP. TLS and HTTP/2 termination
# happen upstream (load balancer, ingress, or platform router) — the
# container itself speaks plain HTTP/1.1 on :80. The browser still sees
# HTTPS + HTTP/2 because of the upstream terminator, so the multiplexing
# benefits for graphql-ws and Hocuspocus apply at the browser↔LB hop.
#
# If you need this container to terminate TLS itself (no upstream LB),
# add a `listen 443 ssl;` block with `http2 on;` and mount the certs into
# /etc/nginx/certs/. See deploy/nginx/default.conf for the dev pattern.

server {
    listen 80 default_server;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Serve the .gz the build already produced, instead of compressing per
    # request. The precompressAssets() plugin in vite.config.ts writes one next
    # to every build output of 1 KiB or more.
    #
    # This is not a small difference: runtime `gzip` runs at gzip_comp_level 1
    # (nginx's default, and the right default when it pays that cost for every
    # request from every client), while the build compresses once at level 9.
    # Measured on the first-paint critical path: 305 KB on the fly, 269 KB
    # precompressed, and zero compression CPU per request.
    #
    # gzip_static needs gzip_vary so shared caches key on Accept-Encoding, or a
    # client that does not send it gets handed a gzip body it cannot read.
    gzip_static on;

    # Runtime gzip stays on for everything without a .gz — chiefly the ~4,000
    # per-icon chunks under the 1 KiB floor, where a compressed copy saves
    # nothing and gzip_min_length below already declined to compress them.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        image/svg+xml
        font/woff
        font/woff2;

    # Brotli would take that same critical path to 230 KB — 25% under today's
    # on-the-fly gzip. It is not enabled because this image cannot do it:
    # nginx:1.27-alpine ships no brotli module, and Alpine's
    # `nginx-mod-http-brotli` is built against nginx 1.26, so it fails the
    # version check a dynamic module is bound by. There is no conditional form
    # of these directives — an unknown one stops nginx from starting — so they
    # stay commented rather than guarded.
    #
    # To turn it on: build the image against an nginx with ngx_brotli (compile
    # it in a builder stage, or move to a base image that bundles it), set
    # `brotli: true` on precompressAssets() in vite.config.ts so the .br files
    # are emitted (about 4.7 MB more in the image), then uncomment:
    #
    #   brotli_static on;
    #
    # `brotli on;` (compress on the fly) is deliberately not part of that: the
    # static files are already at quality 11, which no per-request setting will
    # match. If the upstream TLS terminator can re-encode, doing it there and
    # leaving this container on gzip is also a valid answer.

    # Cache hashed Vite asset bundles aggressively. Vite emits filenames with
    # content hashes, so they can never collide across deploys.
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, immutable";
        # $uri here, not $uri.gz — gzip_static picks the encoded file itself,
        # and naming it would make the request 404 for a client sending no
        # Accept-Encoding.
        try_files $uri =404;
    }

    # Top-level static files (favicon.svg, icons.svg, etc.) — short cache.
    location ~* \.(?:ico|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        access_log off;
        expires 1d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Never cache index.html — it pins the current bundle hash, so a stale
    # copy locks the user on an old build forever.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Lightweight liveness endpoint for orchestrators.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback — every unknown route serves index.html so React Router
    # can pick up the path on the client.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
